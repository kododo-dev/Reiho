name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing: nuget.org exchanges the workflow's OIDC token for a short-lived API key, so the repository
    # keeps no NuGet API key. Policy on nuget.org: owner kododo-dev, this repository, workflow publish-nuget.yml.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x
            11.x

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          for project in Reiho.AspNetCore Reiho.AspNetCore.Mcp; do
            dotnet build src/$project/$project.csproj \
              --configuration Release \
              -p:Version=${{ steps.version.outputs.VERSION }}
          done

      - name: Pack
        run: |
          for project in Reiho.AspNetCore Reiho.AspNetCore.Mcp; do
            dotnet pack src/$project/$project.csproj \
              --configuration Release \
              --no-build \
              -p:Version=${{ steps.version.outputs.VERSION }} \
              --output ./nupkgs
          done

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/Kododo.Reiho.AspNetCore.*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate